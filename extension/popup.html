<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Turing Cockpit Sync</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h3.5l2.5-7 4 14 3-9h5"/></svg> Turing Cockpit Sync</h1>
    <form id="form">
      <label>Course email
        <input id="email" type="email" autocomplete="email" placeholder="your@email.com" />
      </label>
      <label>Cockpit address
        <input id="cockpitUrl" type="url" placeholder="http://localhost:8787" />
      </label>
      <label>Sync every
        <select id="intervalMinutes">
          <option value="15">15 minutes</option>
          <option value="30">30 minutes</option>
          <option value="60">1 hour</option>
          <option value="180">3 hours</option>
          <option value="360">6 hours</option>
        </select>
      </label>
      <button type="submit" id="save" class="primary">Save and sync</button>
    </form>
    <section id="status" aria-live="polite"></section>
    <button id="open" type="button">Open cockpit</button>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
